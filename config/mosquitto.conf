# Mosquitto broker configuration used by this project (Mosquitto 2.x).
# Start:  mosquitto -c config/mosquitto.conf -v
# Mosquitto 2.x only accepts connections from the local machine unless a
# listener is configured, and refuses anonymous clients unless allowed.
listener 1883
allow_anonymous true          # lab use only - add a password file on a real network
# Switch off Nagle's algorithm on the broker's sockets.  Default is false, and
# then every QoS 1 round trip costs ~40 ms extra (see docs/MQTT_SETUP.md).
set_tcp_nodelay true
